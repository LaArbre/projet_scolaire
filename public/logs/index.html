<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal d'activité — SignalPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>

    <div class="page-layout">
        <header class="topbar">
            <div class="topbar-left">
                <a href="/dashboard/" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    Dashboard
                </a>
                <div class="topbar-divider"></div>
                <h1 class="topbar-title">Journal d'activité</h1>
            </div>
            <div class="topbar-right">
                <div class="live-indicator" id="liveIndicator" style="display:none;">
                    <span class="live-dot"></span>
                    <span>En direct</span>
                </div>
                <div id="userChip" class="user-chip">
                    <div id="topbarAvatar" class="topbar-avatar">?</div>
                    <span id="topbarName">…</span>
                </div>
                <button id="btnLogout" class="btn-topbar-logout" title="Déconnexion">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <main class="main">
            <section class="stats-row" id="statsRow">
                <div class="stat-card">
                    <div class="stat-value" id="cntLogin">—</div>
                    <div class="stat-label">Connexions réussies</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="cntFail">—</div>
                    <div class="stat-label">Échecs connexion</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="cntConsult">—</div>
                    <div class="stat-label">Consultations</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="cntLogout">—</div>
                    <div class="stat-label">Déconnexions</div>
                </div>
                <div class="stat-card stat-total">
                    <div class="stat-value" id="cntVisible">—</div>
                    <div class="stat-label">Affichés</div>
                </div>
            </section>

            <section class="filters-bar">
                <div class="filters-left">
                    <div class="filter-group search-group">
                        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="filterUser" class="filter-input filter-search" placeholder="Rechercher par utilisateur…">
                    </div>

                    <div class="filter-group">
                        <select id="filterEvent" class="filter-select">
                            <option value="">Tous les événements</option>
                            <option value="Connexion réussie">Connexion réussie</option>
                            <option value="Échec de connexion">Échec de connexion</option>
                            <option value="Consultation signalement">Consultation signalement</option>
                            <option value="Déconnexion">Déconnexion</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Du</label>
                        <input type="date" id="filterDateFrom" class="filter-input filter-date">
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Au</label>
                        <input type="date" id="filterDateTo" class="filter-input filter-date">
                    </div>

                    <button id="btnResetFilters" class="btn-reset" title="Réinitialiser les filtres">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.72"/></svg>
                        Reset
                    </button>
                </div>
            </section>

            <section class="table-section">
                <div class="table-meta">
                    <span id="tableCount" class="table-count">— résultats</span>
                </div>

                <div class="table-wrapper">
                    <table class="logs-table" id="logsTable">
                        <thead>
                            <tr>
                                <th class="col-date">Date</th>
                                <th class="col-event">Événement</th>
                                <th class="col-user">Utilisateur</th>
                                <th class="col-email">Email</th>
                                <th class="col-info">Info</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton-line"></div></td></tr>
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton-line"></div></td></tr>
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton-line"></div></td></tr>
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton-line"></div></td></tr>
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton-line"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
